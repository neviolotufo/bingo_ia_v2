<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bingo IA v2{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
    <div class="container-fluid px-3 px-md-4">
        <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">Bingo IA v2</a>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-light btn-sm" href="{{ url_for('index') }}">Cartelas</a>
            <a class="btn btn-outline-light btn-sm" href="{{ url_for('players_page') }}">Jogadores</a>
            <a class="btn btn-warning btn-sm" href="{{ url_for('game') }}">Jogo</a>
        </div>
    </div>
</nav>

<div class="container-fluid px-3 px-md-4 pb-5">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
